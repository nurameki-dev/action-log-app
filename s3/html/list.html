<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アクションログ一覧</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="bg-gray-200 min-h-screen">
    <div id="app">
        <header style="background-color:#1a2740" class="text-white p-3 shadow-sm">
            <div class="container">
              <h1 class="fs-4 mb-0 fw-bold">アクションログ一覧</h1>
            </div>
        </header>

        <main class="container py-4">
            <div class="row justify-content-center">
                <div class="col-md-8">
                    <div
                     v-for="log in logs"
                     :key="log.logid"
                     class="card mb-3 " 
                     :style="getPlaceBorderColor(log.place)"
                     style="cursor: default;"
                    >
                        <div class="card-body d-flex justify-content-between align-items-start">
                            <div>
                            <p class="fw-semibold text-dark mb-1">{{log.date}}</p>
                            <p class="text-muted small mb-0">{{log.body}}</p>
                            </div>
                            
                            <!--場所でバッジをつける-->
                            <span class="badge rounded-pill fs-6" :style="getPlaceBadgeColor(log.place)">
                                {{log.place}}
                            </span>
                        </div>
                    </div>

                    <!--ログが0件の場合-->
                    <div v-if="logs.length === 0" class="text-center text-muted py-5">
                        ログがありません
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const {createApp} = Vue;

        createApp({
            data(){
                return{
                    //仮データ あとでdynamoDBのデータに差し替える
                    logs: [
                        {
                            logid:1,
                            body:"test",
                            date:"2026/4/1",
                            place:"会社"
                        },
                        {
                            logid:2,
                            body:"test2",
                            date:"2026/4/2",
                            place:"部屋"
                        },
                        {
                            logid:1,
                            body:"test3",
                            date:"2026/4/3",
                            place:"会社"
                        }                    
                        
                    ]
                };
            },
            methods: {
                getPlaceBorderColor(place) {
                    const colors = {
                        "会社": { border: "4px solid #6d2b3d"},
                        "部屋": { border: "4px solid #dd1111"}
                    };
                    return colors[place] || { border: "2px solid #6c757d"};
                },
                getPlaceBadgeColor(place) {
                    const colors = {
                        "会社": { backgroundColor: "#6d2b3d", color: "#ffffff"},
                        "部屋": { backgroundColor: "#dd1111", color: "#ffffff"}
                    };
                    return colors[place] || { backgroundColor: "#6c757d", color: "#ffffff" };
                }
            }
        }).mount("#app")


    </script>
</body>
</html>
